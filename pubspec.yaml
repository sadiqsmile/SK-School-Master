name: school_app
description: "SK School Master is a smart school management platform for administrators, teachers, parents, and students."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.1+2

environment:
    sdk: ">=3.3.0 <4.0.0"


dependencies:

  extended_image: ^8.2.0
  image: ^4.1.7
  path_provider: ^2.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.2
  excel: ^4.0.6
  syncfusion_flutter_xlsio: ^29.2.11
  pdf: ^3.11.1
  printing: ^5.13.4
  csv: ^6.0.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0

  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  fl_chart: ^0.68.0

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  firebase_storage: ^12.4.10

  table_calendar: ^3.0.9
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  


  # App store polish
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png





